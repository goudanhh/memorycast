name: Check learning insights

on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/src/server.js'
      - 'scripts/check-learning-stats.mjs'
      - '.github/workflows/check-learning-stats.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and dashboard contracts
        run: node scripts/check-learning-stats.mjs
      - name: Check memory game logic and routes
        run: node scripts/check-games.mjs
      - name: Verify retired Feynman feature is removed
        run: node scripts/check-remove-feynman.mjs
      - name: Test knowledge adventure levels and progression
        run: node scripts/check-adventure.mjs
      - name: Validate hybrid real-time arcade and persistence
        run: node scripts/check-rogue.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actually play the hybrid game in Chromium
        run: node scripts/smoke-rogue.mjs
      - name: Save proof of gameplay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-arcade-browser-screenshot
          path: artifacts/rogue-actual-gameplay.png
          if-no-files-found: ignore
