services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorycast}
      POSTGRES_USER: ${POSTGRES_USER:-memorycast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memorycast} -d ${POSTGRES_DB:-memorycast}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [memorycast]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-memorycast}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-memorycast}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      FEYNMAN_FAST_MODEL: ${FEYNMAN_FAST_MODEL:-}
      FEYNMAN_DEEP_MODEL: ${FEYNMAN_DEEP_MODEL:-}
      OCR_MODEL: ${OCR_MODEL:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/google/gemma-4-26b-a4b-it}
      CLOUDFLARE_STT_MODEL: ${CLOUDFLARE_STT_MODEL:-@cf/openai/whisper-large-v3-turbo}
      CLOUDFLARE_OCR_MODEL: ${CLOUDFLARE_OCR_MODEL:-@cf/moondream/moondream3.1-9B-A2B}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-openrouter/free}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-openai/whisper-large-v3}
      FSRS_RETENTION: ${FSRS_RETENTION:-0.90}
      TTS_PROVIDER: ${TTS_PROVIDER:-browser}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_MULTILINGUAL_VOICE: ${AZURE_MULTILINGUAL_VOICE:-en-US-AvaMultilingualNeural}
      TTS_CACHE_DIR: /app/tts-cache
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tts_cache:/app/tts-cache
    networks: [memorycast]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks: [memorycast]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks: [memorycast]

volumes:
  postgres_data:
  tts_cache:

networks:
  memorycast:
    driver: bridge
