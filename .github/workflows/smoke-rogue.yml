name: Smoke test hybrid MemoryCast gameplay

on:
  pull_request:
    paths:
      - 'web/rogue*'
      - 'web/index.html'
      - 'scripts/smoke-rogue.mjs'
      - '.github/workflows/smoke-rogue.yml'
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play in a real headless browser
        run: node scripts/smoke-rogue.mjs
      - name: Upload actual gameplay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-rogue-gameplay-screenshot
          path: artifacts/rogue-*-gameplay.png
          if-no-files-found: ignore
