<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>萌音工坊 · Azure TTS</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#493e57;background:#fff9fd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#ffe6ef 0,transparent 37%),radial-gradient(circle at 90% 7%,#e9e0ff 0,transparent 40%),#fff9fd;min-height:100vh}.wrap{max-width:1010px;margin:0 auto;padding:42px 20px}.hero{text-align:center;margin-bottom:27px}.eyebrow{color:#bc78a1;font-size:13px;font-weight:700;letter-spacing:3px}.hero h1{font-size:clamp(30px,5vw,49px);margin:9px 0 6px}.hero p{color:#877b92;font-size:15px}.shell{display:grid;grid-template-columns:1fr 300px;gap:20px}.panel{background:#fff;border:1px solid #f1e7f1;border-radius:26px;padding:26px;box-shadow:0 12px 38px #8a5a8b10}.label{font-weight:760;margin-bottom:12px;font-size:15px}.muted{color:#93889b;font-size:12px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}.voice{border:1.5px solid #f0e6f1;border-radius:15px;background:#fff;display:flex;gap:10px;align-items:center;padding:12px;text-align:left;cursor:pointer;color:#4e4358}.voice.active{border-color:#e995c9;background:#fff2fa}.emoji{display:grid;place-items:center;width:39px;height:39px;border-radius:14px;background:#fbe7f5;font-size:23px}.voice strong{font-size:14px}.voice small{display:block;color:#95879a;font-size:11px;margin-top:4px}.text{width:100%;height:155px;resize:vertical;padding:16px;border:1.5px solid #efe3ed;border-radius:17px;font:inherit;line-height:1.75;outline:none;color:#4e4358}.text:focus{border-color:#e995c9}.subline{display:flex;justify-content:space-between;align-items:center;margin:8px 0 23px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #eee2ed;border-radius:30px;padding:9px 13px;background:white;cursor:pointer;color:#796a86}.chip.active{background:#ffecf6;border-color:#f0a8d1;color:#bd578b}.range{display:flex;justify-content:space-between;margin:22px 0 8px;font-size:14px}.range strong{color:#b95d96}input[type=range]{width:100%;accent-color:#d584b9}.btn{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(120deg,#e98cbf,#a58ff2);color:white;font:inherit;font-weight:800;cursor:pointer;margin-top:18px;box-shadow:0 6px 15px #c58fb94d}.btn:disabled{opacity:.55;cursor:wait}.secondary{margin-top:10px;background:#fff;color:#b773ac;border:1px solid #ecd6e7;box-shadow:none;text-align:center;display:block;text-decoration:none}.secondary.hidden{display:none}.player{width:100%;margin-top:18px}.info{font-size:12px;color:#91849a;line-height:1.8;margin-top:14px}.status{font-size:13px;color:#bb608b;min-height:22px;margin-top:10px}.pill{display:inline-block;background:#fff0f8;border-radius:99px;color:#bf75a2;padding:6px 12px;font-size:12px;margin-bottom:8px}@media(max-width:740px){.shell{grid-template-columns:1fr}.wrap{padding:22px 12px}.panel{padding:20px}.options{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="hero"><div class="eyebrow">✧ SWEET VOICE STUDIO ✧</div><h1>🐰 萌音工坊 <span style="font-size:25px">✨</span></h1><p>用 Azure TTS，把你写的每一句话变成软萌小声音</p></div><div class="shell"><section class="panel"><div class="label">🎀 选择音色</div><div id="voices" class="options"></div><div class="label">✏️ 输入想说的话</div><textarea class="text" id="text" maxlength="1200">你好呀！欢迎来到萌音工坊～今天也要开开心心的哦！</textarea><div class="subline"><span class="muted">支持中文和英文，请选择对应语言音色</span><span id="count" class="muted">0/1200</span></div><div class="label">💗 说话情绪</div><div class="chips" id="styles"></div><div class="status" id="status"></div><audio id="player" class="player" controls hidden></audio></section><aside class="panel"><span class="pill">✨ 魔法调音台</span><div class="label">调出属于你的萌系声音</div><div class="range"><span>🐿️ 语速</span><strong id="rateVal">+8%</strong></div><input type="range" id="rate" min="-40" max="70" value="8"><div class="range"><span>🎈 音调</span><strong id="pitchVal">+10%</strong></div><input type="range" id="pitch" min="-20" max="30" value="10"><div class="range"><span>🍬 情绪强度</span><strong id="degreeVal">1.0</strong></div><input type="range" id="degree" min="0.5" max="1.5" step="0.1" value="1"><button id="go" class="btn">♡ 生成并试听</button><a id="download" class="btn secondary hidden" download="萌音工坊.mp3">↓ 下载 MP3</a><div class="info">音色由 Azure 合成，音调和语速只是调节原音色，并非训练新音色。<br>密钥只保存在服务器端；生成成功后可以下载音频。</div></aside></div></main><script>
const voices=[['zh-CN-XiaoyouNeural','小优','软萌童声','🐣',[]],['zh-CN-XiaoshuangNeural','小双','活泼童声','🐰',['chat']],['zh-CN-XiaomengNeural','小梦','甜甜聊天','🍓',['chat']],['zh-CN-XiaoxiaoNeural','晓晓','温柔元气','🌸',['cheerful','affectionate','gentle','chat','whispering']],['zh-CN-XiaoyiNeural','晓伊','俏皮清新','🧸',['cheerful','affectionate','gentle']],['zh-CN-XiaoyouMultilingualNeural','小优多语','可爱风格','🍭',['cute','cheerful','chat','story']],['en-US-AvaNeural','Ava','英文活力','🌈',['cheerful','friendly','whispering']],['en-US-JennyNeural','Jenny','英文甜美','✨',['cheerful','friendly','excited']]];
const labels={default:'自然',chat:'聊天',cute:'软萌',cheerful:'开心',affectionate:'撒娇感',gentle:'轻柔',whispering:'悄悄话',story:'讲故事',friendly:'友好',excited:'兴奋'};
const $=id=>document.getElementById(id);let selected=voices[0],style='default',url='';function render(){ $('voices').innerHTML=voices.map((v,i)=>`<button class="voice ${selected[0]===v[0]?'active':''}" data-i="${i}"><span class="emoji">${v[3]}</span><span><strong>${v[1]}</strong><small>${v[2]}</small></span></button>`).join(''); document.querySelectorAll('.voice').forEach(b=>b.onclick=()=>{selected=voices[+b.dataset.i];style='default';render()});$('styles').innerHTML=['default',...selected[4]].map(s=>`<button class="chip ${style===s?'active':''}" data-s="${s}">${labels[s]||s}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{style=b.dataset.s;render()});}render();
['rate','pitch','degree'].forEach(id=>{const fn=()=>$(id+'Val').textContent=id==='degree'?$(id).value:(+$(id).value>=0?'+':'')+$(id).value+'%';$(id).addEventListener('input',fn);fn()});const count=()=>{$('count').textContent=$('text').value.length+'/1200'};$('text').addEventListener('input',count);count();
$('go').onclick=async()=>{const btn=$('go');btn.disabled=true;btn.textContent='✨ 正在施展萌音魔法…';$('status').textContent='';try{let res=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('text').value,voice:selected[0],style,rate:+$('rate').value,pitch:+$('pitch').value,degree:+$('degree').value})});if(!res.ok){let e=await res.json().catch(()=>({error:'请求失败'}));throw Error(e.error||'请求失败')}let blob=await res.blob();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('player').src=url;$('player').hidden=false;$('download').href=url;$('download').classList.remove('hidden');$('status').textContent='生成成功！可以试听或下载 ♡';$('player').play().catch(()=>{});}catch(e){$('status').textContent='⚠ '+e.message}finally{btn.disabled=false;btn.textContent='♡ 生成并试听'}};
</script></body></html>
