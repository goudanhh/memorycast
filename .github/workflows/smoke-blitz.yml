name: Playtest Listening Blitz

on:
  pull_request:
    paths:
      - 'web/blitz*'
      - 'web/index.html'
      - 'api/src/blitz*'
      - 'scripts/smoke-blitz.mjs'
      - '.github/workflows/smoke-blitz.yml'
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Complete listening burst on desktop and mobile
        run: node scripts/smoke-blitz.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitz-browser-screenshots
          path: artifacts/blitz-*.png
          if-no-files-found: ignore
