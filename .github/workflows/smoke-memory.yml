name: Playtest active recall training

on:
  pull_request:
    paths:
      - 'web/memory-*'
      - 'web/index.html'
      - 'scripts/smoke-memory.mjs'
      - '.github/workflows/smoke-memory.yml'
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Complete memory training on desktop and mobile
        run: node scripts/smoke-memory.mjs
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-training-browser-screenshots
          path: artifacts/memory-*.png
          if-no-files-found: ignore
